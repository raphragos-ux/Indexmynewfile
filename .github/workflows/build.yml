name: Build & Deploy Proxy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  SERVICE_NAME: rafael-proxy
  PORT: 8080

jobs:
  deploy:
    runs-on: ubuntu-latest
    # ✅ Siguradong may access sa secrets
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ✅ Tamang paraan ng pag-authenticate
      - name: Authenticate GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Enable APIs
        run: |
          gcloud services enable run.googleapis.com cloudbuild.googleapis.com artifactregistry.googleapis.com --quiet

      # ... (iwanan ang lahat ng steps na gumagawa ng config, Dockerfile, build, deploy — pareho pa rin)
