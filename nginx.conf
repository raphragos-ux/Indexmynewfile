worker_processes auto;
worker_rlimit_nofile 200000;

events {
    worker_connections 65535;
    multi_accept on;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100000;
    client_max_body_size 0;

    proxy_connect_timeout 300;
    proxy_send_timeout 86400;
    proxy_read_timeout 86400;
    proxy_buffering off;
    proxy_request_buffering off;

    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8080;
        http2 on;

        # 📌 Para lumabas ang iyong homepage
        root /usr/share/nginx/html;
        index index.html;
        location = / {
            try_files $uri /index.html;
        }

        # 📌 Mga daanan para sa Xray (una ito bago ang pangkalahatang proxy)
        location /Rafael-Tv {
            proxy_pass http://127.0.0.1:10000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }

        location /trojan-rafael {
            proxy_pass http://127.0.0.1:10001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }

        location /vless-rafael {
            proxy_pass http://127.0.0.1:10002;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_request_buffering off;
            chunked_transfer_encoding off;
            proxy_read_timeout 86400;
        }

        location /httpupgrade-rafael {
            proxy_pass http://127.0.0.1:11004;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }

        # 📌 Pangkalahatang proxy (ilagay sa HULI)
        location / {
            proxy_ssl_server_name on;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            proxy_pass https://www.google.com;
            proxy_set_header Host www.google.com;
            proxy_set_header Referer https://www.google.com/;
            proxy_set_header Origin https://www.google.com/;
            proxy_set_header Connection "";
            proxy_http_version 1.1;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
